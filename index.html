<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acessar Conteúdo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0088cc, #005f99);
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .logo {
      width: 80px;
      margin-bottom: 20px;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0088cc;
      color: white;
      padding: 15px 25px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn:hover {
      background: #00aaff;
      transform: scale(1.05);
    }

    .icon {
      width: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">

    <h1>Entrar no Telegram</h1>

    <a class="btn" href="#" onclick="redirect()">
      <img class="icon" src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">
      Acessar agora
    </a>
  </div>

  <script>
    function redirect() {
      const linkOriginal = "https://apextry.com/go/dudavip?code=07"; // COLOCA SEU LINK
      window.location.href = linkOriginal;
    }
  </script>

</body>
</html>
